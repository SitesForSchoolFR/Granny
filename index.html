<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#07080a" />
    <meta
      name="description"
      content="Escape House — jogo de terror e furtividade em primeira pessoa no navegador. Ache os itens, resolva os puzzles e saia da casa antes que ela te encontre."
    />
    <title>Escape House</title>
    <link rel="stylesheet" href="/src/styles/main.css" />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%230d0f13'/%3E%3Cpath d='M16 5l9 7v15H7V12z' fill='none' stroke='%23b4331f' stroke-width='2.4'/%3E%3C/svg%3E"
    />
  </head>
  <body>
    <div id="game" class="stage">
      <!-- Render alvo do Three.js. Nada de DOM dentro do canvas. -->
      <canvas id="scene" class="stage__canvas"></canvas>

      <!-- Camada HUD (DOM por performance: texto nítido, sem custo de redraw 3D) -->
      <div id="hud" class="hud" hidden></div>

      <!-- Camada de telas/menus -->
      <div id="screens" class="screens"></div>

      <!-- Fade do preto: a run começa no escuro (doc Parte 2 §1). -->
      <div id="fade" class="fade"></div>

      <!-- Loader, visível até o state machine sair de LOADING -->
      <div id="loading" class="loading">
        <div class="loading__inner">
          <p class="loading__title">ESCAPE&nbsp;HOUSE</p>
          <div class="loading__bar"><i id="loading-fill"></i></div>
          <p class="loading__label" id="loading-label">acordando…</p>
        </div>
      </div>
    </div>

    <noscript>
      <p style="color: #eee; font: 16px/1.5 system-ui; padding: 24px">
        Este jogo precisa de JavaScript habilitado (e de WebGL).
      </p>
    </noscript>

    <!--
      Vigia de boot — roda ANTES e INDEPENDENTE do bundle.

      Se o JS não carregar (404 de caminho, HTML em cache apontando para um
      build antigo, CSP, extensão de navegador), o jogo fica preso no
      "acordando…" para sempre, sem erro visível. Este script é inline, então
      continua vivo quando o bundle morre, e diz o que aconteceu.

      Estados que ele distingue:
        started=false -> o arquivo do jogo nem chegou a rodar
        started=true, booted=false -> rodou, mas o boot travou (ver console)
        failed=[...]  -> URL exata do recurso que deu erro
    -->
    <script>
      window.__escapeHouse = { started: false, booted: false, failed: [] }
      window.addEventListener(
        'error',
        function (e) {
          var t = e.target
          if (t && (t.tagName === 'SCRIPT' || t.tagName === 'LINK')) {
            window.__escapeHouse.failed.push(t.src || t.href || t.tagName)
          }
        },
        true, // erros de recurso não borbulham: precisa capturar
      )
      function reason() {
        var st = window.__escapeHouse
        var stage = st.stage ? ' (etapa: <code>' + st.stage + '</code>)' : ''
        if (st.failed.length) return 'falhou: <code>' + st.failed.join(', ') + '</code>'
        if (st.started) return 'o jogo carregou, mas o boot não terminou' + stage
        return 'o arquivo do jogo não carregou — 404 ou HTML em cache'
      }

      // 8s: só avisa, SEM destruir a tela. Se for apenas uma conexão lenta, o
      // boot termina e o próprio loading desaparece, levando o aviso junto.
      window.setTimeout(function () {
        var st = window.__escapeHouse
        if (st.booted) return
        var inner = document.querySelector('#loading .loading__inner')
        if (!inner || document.getElementById('loading-hint')) return
        var p = document.createElement('p')
        p.id = 'loading-hint'
        p.className = 'loading__hint'
        p.innerHTML = 'ainda carregando… ' + reason() + ' <button type="button" class="btn" id="loading-retry">recarregar sem cache</button>'
        inner.appendChild(p)
        var btn = document.getElementById('loading-retry')
        if (btn) {
          btn.addEventListener('click', function () {
            location.replace(location.pathname + '?nocache=' + Date.now())
          })
        }
      }, 8000)

      // 25s: agora é falha de verdade — troca a tela inteira.
      window.setTimeout(function () {
        var st = window.__escapeHouse
        if (st.booted) return
        var box = document.getElementById('loading')
        if (!box) return
        box.classList.add('is-error')
        box.innerHTML =
          '<div class="loading__inner">' +
          '<p class="loading__title">A CASA NÃO ABRIU</p>' +
          '<p class="loading__label">' + reason() + '</p>' +
          '<p class="loading__hint">url: <code>' + location.href + '</code></p>' +
          '<p class="loading__hint"><button type="button" class="btn" id="loading-retry2">recarregar sem cache</button></p>' +
          '</div>'
        var btn = document.getElementById('loading-retry2')
        if (btn) {
          btn.addEventListener('click', function () {
            location.replace(location.pathname + '?nocache=' + Date.now())
          })
        }
      }, 25000)
    </script>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
