name: Deploy no GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Lógica pura testada sem navegador: planta, colisão, IA, puzzles, save.
      - run: npm run smoke
      - run: npm run build
      # O erro classico de Vite + Pages: base diferente do nome do repo.
      # Os assets vao para /nome-errado/ e o site abre branco sem nenhum erro
      # de build. Falha aqui, com o nome esperado no log.
      - name: base do Vite bate com o nome do repositorio?
        run: |
          REPO="${GITHUB_REPOSITORY#*/}"
          if ! grep -q "/${REPO}/assets/" dist/index.html; then
            echo "::error::dist/index.html nao aponta para /${REPO}/assets/. Confira REPO_NAME em vite.config.js."
            grep -oE '(href|src)="/[a-zA-Z0-9._-]+/assets/[^"]+"' dist/index.html || true
            exit 1
          fi
          echo "ok: assets em /${REPO}/assets/"
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
