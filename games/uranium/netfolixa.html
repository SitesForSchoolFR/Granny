<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <title>DriveFlix</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: Arial, Helvetica, sans-serif;
            background: #080808;
            color: white;
        }
        header {
            position: sticky;
            top: 0;
            z-index: 100;
            background: #101010;
            border-bottom: 1px solid #222;
            padding: 16px 25px;
            display: flex;
            align-items: center;
            gap: 25px;
        }
        .logo {
            font-size: 25px;
            font-weight: bold;
            color: #00ff88;
            white-space: nowrap;
        }
        .search {
            flex: 1;
            max-width: 600px;
        }
        .search input {
            width: 100%;
            padding: 12px 16px;
            border-radius: 8px;
            border: 1px solid #333;
            background: #181818;
            color: white;
            outline: none;
        }
        .search input:focus {
            border-color: #00ff88;
        }
        .hero {
            padding: 55px 7%;
            background:
                linear-gradient(90deg, #050505 20%, transparent),
                linear-gradient(180deg, #101010, #080808);
        }
        .hero h1 {
            font-size: 45px;
            margin-bottom: 12px;
        }
        .hero p {
            color: #aaa;
            max-width: 650px;
        }
        .categories {
            padding: 20px 7%;
            display: flex;
            gap: 10px;
            overflow-x: auto;
        }
        .category {
            background: #181818;
            border: 1px solid #292929;
            color: #ddd;
            padding: 9px 16px;
            border-radius: 20px;
            cursor: pointer;
            white-space: nowrap;
        }
        .category:hover, .category.active {
            background: #00ff88;
            color: #000;
        }
        .container {
            padding: 20px 7% 50px;
        }
        .movie-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
            gap: 22px;
        }
        .movie {
            background: #111;
            border-radius: 10px;
            overflow: hidden;
            cursor: pointer;
            transition: .2s;
            border: 1px solid #222;
        }
        .movie:hover {
            transform: translateY(-5px);
            border-color: #00ff88;
        }
        .poster {
            width: 100%;
            aspect-ratio: 2 / 3;
            object-fit: cover;
            display: block;
            background: #181818;
        }
        .movie-info {
            padding: 12px;
        }
        .movie-title {
            font-weight: bold;
            margin-bottom: 6px;
            font-size: 14px;
        }
        .movie-category {
            color: #888;
            font-size: 13px;
        }
        .player-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, .94);
            z-index: 500;
            display: none;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .player {
            width: min(1100px, 100%);
            background: #111;
            border-radius: 12px;
            overflow: hidden;
        }
        .player-top {
            padding: 14px 18px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #222;
        }
        .player-title {
            font-weight: bold;
        }
        .close {
            background: #222;
            border: 0;
            color: white;
            font-size: 20px;
            width: 35px;
            height: 35px;
            border-radius: 6px;
            cursor: pointer;
        }
        .close:hover {
            background: #00ff88;
            color: #000;
        }
        .video-container {
            background: #000;
            aspect-ratio: 16 / 9;
        }
        .video-container iframe {
            width: 100%;
            height: 100%;
            border: 0;
        }
        .empty {
            text-align: center;
            color: #777;
            padding: 50px;
            display: none;
        }
        @media (max-width: 600px) {
            header {
                flex-direction: column;
                align-items: stretch;
                gap: 12px;
            }
            .logo {
                text-align: center;
            }
            .hero {
                padding: 35px 5%;
            }
            .hero h1 {
                font-size: 32px;
            }
            .container {
                padding: 15px 5% 40px;
            }
            .movie-grid {
                grid-template-columns: repeat(2, 1fr);
                gap: 12px;
            }
        }
    </style>
</head>
<body>
    <header>

        let currentCategory = "All";

        function createCategories() {
            const categories = ["All", ...new Set(movies.map(m => m.category))];
            const container = document.getElementById("categories");
            container.innerHTML = "";
            categories.forEach(category => {
                const button = document.createElement("button");
                button.className = "category" + (category === currentCategory ? " active" : "");
                button.textContent = category;
                button.onclick = () => {
                    currentCategory = category;
                    createCategories();
                    renderMovies();
                };
                container.appendChild(button);
            });
        }

        function renderMovies() {
            const grid = document.getElementById("movieGrid");
            const empty = document.getElementById("empty");
            const search = document.getElementById("search").value.toLowerCase().trim();
            grid.innerHTML = "";
            const filtered = movies.filter(movie => {
                const matchesSearch = movie.title.toLowerCase().includes(search);
                const matchesCategory = currentCategory === "All" || movie.category === currentCategory;
                return matchesSearch && matchesCategory;
            });
            if (filtered.length === 0) {
                empty.style.display = "block";
                return;
            }
            empty.style.display = "none";
            filtered.forEach(movie => {
                const card = document.createElement("div");
                card.className = "movie";
                card.onclick = () => openMovie(movie);
                card.innerHTML = `
                    <img class="poster" src="${movie.poster}" alt="${escapeHTML(movie.title)}" loading="lazy"
                        onerror="this.src='https://placehold.co/400x600/111111/00ff88?text=No+Poster'">
                    <div class="movie-info">
                        <div class="movie-title">${escapeHTML(movie.title)}</div>
                        <div class="movie-category">${escapeHTML(movie.category)}</div>
                    </div>`;
                grid.appendChild(card);
            });
        }

        function openMovie(movie) {
            if (!movie.driveId || movie.driveId === "YOUR_GOOGLE_DRIVE_FILE_ID") {
                alert("This movie does not have a Google Drive file ID configured yet.");
                return;
            }
            document.getElementById("playerTitle").textContent = movie.title;
            document.getElementById("player").src = `https://drive.google.com/file/d/${encodeURIComponent(movie.driveId)}/preview`;
            document.getElementById("playerOverlay").style.display = "flex";
        }

        function closePlayer() {
            document.getElementById("playerOverlay").style.display = "none";
            document.getElementById("player").src = "";
        }

        function escapeHTML(text) {
            const div = document.createElement("div");
            div.textContent = text;
            return div.innerHTML;
        }

        document.addEventListener("keydown", e => { if (e.key === "Escape") closePlayer(); });
        
        document.getElementById("playerOverlay").addEventListener("click", e => {
            if (e.target.id === "playerOverlay") closePlayer();
        });

        createCategories();
        renderMovies();
    </script>
