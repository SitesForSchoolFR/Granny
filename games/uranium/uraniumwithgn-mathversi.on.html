<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Uranium Games</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;}
body{font-family:'Segoe UI',Tahoma,Geneva,Verdana,sans-serif;background:#0a0e1a;min-height:100vh;color:#fff;overflow-x:hidden;position:relative;}
body::before{content:'';position:fixed;top:0;left:0;width:100%;height:100%;background:radial-gradient(circle at 20% 50%,rgba(0,255,136,0.1)0%,transparent50%),radial-gradient(circle at 80% 80%,rgba(57,255,20,0.1)0%,transparent50%),radial-gradient(circle at 40% 20%,rgba(0,255,136,0.05)0%,transparent40%);pointer-events:none;z-index:0;}
.container{max-width:1400px;margin:0 auto;padding:20px;position:relative;z-index:1;}
header{text-align:center;padding:50px 20px;background:rgba(10,20,30,0.8);backdrop-filter:blur(10px);border-radius:20px;margin-bottom:40px;box-shadow:0 0 40px rgba(0,255,136,0.3),inset 0 0 60px rgba(0,255,136,0.1),0 8px 32px rgba(0,0,0,0.5);border:1px solid rgba(0,255,136,0.3);animation:slideDown 0.6s ease-out,glow 3s ease-in-out infinite;position:relative;overflow:hidden;}
header::before{content:'☢️';position:absolute;font-size:15em;opacity:0.05;top:50%;left:50%;transform:translate(-50%,-50%);animation:rotate 20s linear infinite;}
@keyframes rotate{from{transform:translate(-50%,-50%) rotate(0deg);}to{transform:translate(-50%,-50%) rotate(360deg);}}
@keyframes slideDown{from{opacity:0;transform:translateY(-30px);}to{opacity:1;transform:translateY(0);}}
@keyframes glow{0%,100%{box-shadow:0 0 40px rgba(0,255,136,0.3),inset 0 0 60px rgba(0,255,136,0.1),0 8px 32px rgba(0,0,0,0.5);}50%{box-shadow:0 0 60px rgba(0,255,136,0.5),inset 0 0 80px rgba(0,255,136,0.15),0 8px 32px rgba(0,0,0,0.5);}}
h1{font-size:4em;margin-bottom:10px;text-shadow:0 0 10px rgba(0,255,136,0.8),0 0 20px rgba(0,255,136,0.6),0 0 30px rgba(0,255,136,0.4),2px 2px 4px rgba(0,0,0,0.5);background:linear-gradient(to right,#00ff88,#39ff14,#00ff88);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;animation:textGlow 2s ease-in-out infinite;position:relative;z-index:1;font-weight:900;letter-spacing:3px;}
@keyframes textGlow{0%,100%{filter:brightness(1);}50%{filter:brightness(1.3);}}
.tagline{font-size:1.2em;color:#00ff88;opacity:0.9;text-shadow:0 0 10px rgba(0,255,136,0.5);position:relative;z-index:1;}
.status-line{margin-top:14px;font-size:0.8em;letter-spacing:2px;color:rgba(0,255,136,0.7);position:relative;z-index:1;}
.search-bar{margin:30px 0;display:flex;justify-content:center;animation:fadeIn 0.8s ease-out 0.3s both;}
@keyframes fadeIn{from{opacity:0;transform:translateY(20px);}to{opacity:1;transform:translateY(0);}}
.search-bar input{width:500px;max-width:90vw;padding:15px 25px;font-size:1.1em;border:2px solid rgba(0,255,136,0.4);border-radius:50px;background:rgba(10,20,30,0.9);box-shadow:0 0 20px rgba(0,255,136,0.2),inset 0 0 20px rgba(0,255,136,0.05);transition:all 0.3s ease;color:#00ff88;}
.search-bar input::placeholder{color:rgba(0,255,136,0.5);}
.search-bar input:focus{outline:none;border-color:#00ff88;box-shadow:0 0 30px rgba(0,255,136,0.4),inset 0 0 20px rgba(0,255,136,0.1);transform:scale(1.02);}
.filter-bar{display:flex;justify-content:center;gap:12px;margin-bottom:24px;flex-wrap:wrap;animation:fadeIn 0.8s ease-out 0.4s both;}
.filter-btn{background:rgba(10,20,30,0.9);border:2px solid rgba(0,255,136,0.3);color:rgba(0,255,136,0.7);padding:9px 22px;border-radius:30px;font-size:0.9em;font-weight:600;letter-spacing:1px;cursor:pointer;transition:all 0.25s ease;}
.filter-btn:hover{border-color:#00ff88;color:#00ff88;box-shadow:0 0 15px rgba(0,255,136,0.3);}
.filter-btn.active{background:#00ff88;color:#000;border-color:#00ff88;box-shadow:0 0 20px rgba(0,255,136,0.6);}
.game-count{font-size:1em;color:#00ff88;text-shadow:0 0 8px rgba(0,255,136,0.6);margin-bottom:10px;opacity:0.9;font-weight:600;text-align:right;padding-right:10px;}
.games-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:30px;margin-top:30px;justify-items:center;}
@media(max-width:1000px){.games-grid{grid-template-columns:repeat(3,1fr);}}
@media(max-width:768px){.games-grid{grid-template-columns:repeat(2,1fr);}}
@media(max-width:500px){.games-grid{grid-template-columns:1fr;}}
.game-card{background:rgba(10,20,30,0.8);backdrop-filter:blur(10px);border-radius:20px;overflow:hidden;cursor:pointer;transition:all 0.4s ease;box-shadow:0 0 20px rgba(0,255,136,0.2),0 8px 25px rgba(0,0,0,0.5);border:1px solid rgba(0,255,136,0.3);animation:fadeInUp 0.5s ease-out both;text-decoration:none;color:inherit;display:block;width:100%;max-width:220px;}
a.game-card:visited{color:inherit;}
.game-card:hover{transform:translateY(-10px) scale(1.02);box-shadow:0 0 40px rgba(0,255,136,0.5),0 15px 40px rgba(0,0,0,0.5);border-color:#00ff88;}
@keyframes fadeInUp{from{opacity:0;transform:translateY(30px);}to{opacity:1;transform:translateY(0);}}
.game-image{width:100%;aspect-ratio:1/1;background:linear-gradient(135deg,#001a0f 0%,#003d29 100%);position:relative;overflow:hidden;box-shadow:inset 0 0 30px rgba(0,255,136,0.1);}
.game-image img{width:100%;height:100%;object-fit:cover;transition:all 0.3s ease;}
.game-image .fallback{position:absolute;inset:0;display:none;align-items:center;justify-content:center;flex-direction:column;gap:8px;color:rgba(0,255,136,0.5);font-size:0.75em;letter-spacing:2px;text-align:center;padding:10px;}
.game-source-tag{position:absolute;top:8px;left:8px;background:rgba(0,0,0,0.7);border:1px solid rgba(0,255,136,0.5);color:#00ff88;font-size:0.62em;letter-spacing:1px;padding:3px 7px;border-radius:20px;z-index:2;}
.game-info{padding:20px;}
.game-title{font-size:1.2em;font-weight:700;margin-bottom:4px;color:#00ff88;text-shadow:0 0 10px rgba(0,255,136,0.5);}
.game-author{font-size:0.72em;color:rgba(0,255,136,0.5);letter-spacing:1px;}
.floating-particles{position:fixed;top:0;left:0;width:100%;height:100%;pointer-events:none;z-index:0;}
.particle{position:absolute;width:3px;height:3px;background:#00ff88;border-radius:50%;box-shadow:0 0 10px #00ff88;animation:float 15s infinite ease-in-out;}
.particle:nth-child(1){top:20%;left:10%;animation-delay:0s;}
.particle:nth-child(2){top:40%;left:30%;animation-delay:2s;}
.particle:nth-child(3){top:60%;left:70%;animation-delay:4s;}
.particle:nth-child(4){top:80%;left:50%;animation-delay:1s;}
.particle:nth-child(5){top:15%;left:85%;animation-delay:3s;}
@keyframes float{0%,100%{transform:translateY(0) translateX(0);opacity:0;}10%,90%{opacity:1;}50%{transform:translateY(-100px) translateX(50px);}}
.loading-state{grid-column:1/-1;text-align:center;padding:60px 20px;color:rgba(0,255,136,0.7);}
.spinner{width:40px;height:40px;border:3px solid rgba(0,255,136,0.2);border-top-color:#00ff88;border-radius:50%;margin:0 auto 16px;animation:spin 0.8s linear infinite;}
@keyframes spin{to{transform:rotate(360deg);}}
#gameModal{display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.9);z-index:9999;align-items:center;justify-content:center;flex-direction:column;}
#gameFrame{width:90%;height:85%;border:none;border-radius:15px;box-shadow:0 0 30px rgba(0,255,136,0.5);background:#000;}
#closeBtn{position:absolute;top:30px;right:50px;background:#00ff88;color:#000;font-weight:bold;font-size:1.2em;padding:10px 20px;border:none;border-radius:30px;cursor:pointer;box-shadow:0 0 20px rgba(0,255,136,0.6);transition:0.3s;}
#closeBtn:hover{background:#39ff14;}
#modalError{display:none;flex-direction:column;align-items:center;gap:14px;color:#ff5c5c;text-align:center;max-width:400px;}
#modalError .icon{font-size:2.4em;}
</style>
</head>

</div>

const sources = [
  {
            name: "GN Math Zone",
            type: "json",
            json: "https://cdn.jsdelivr.net/gh/freebuisness/assets@main/zones.json",
            cover: "https://cdn.jsdelivr.net/gh/freebuisness/covers@main",
            html: "https://cdn.jsdelivr.net/gh/freebuisness/html@main"
        },


];
    
function renderGames(list) {
    gameCountEl.textContent = list.length + " Games";
    gamesGrid.innerHTML = '';
    if (list.length === 0) {
        gamesGrid.innerHTML = '<div class="loading-state">No games match your search.</div>';
        return;
    }
    const frag = document.createDocumentFragment();
    list.forEach((game, i) => {
        const card = document.createElement('a');
        card.href = '#';
        card.className = 'game-card';
        card.style.animationDelay = (Math.min(i, 25) * 0.03) + 's';
        card.innerHTML = `
            <div class="game-image">
             
                <img src="${game.resolvedCover}" alt="${game.name}" loading="lazy"
                    onerror="this.style.display='none'; this.parentElement.querySelector('.fallback').style.display='flex';">
                <div class="fallback">NO IMAGE<br>${game.name}</div>
            </div>
            <div class="game-info">
                <div class="game-title">${game.name}</div>
                <div class="game-author">${game.author || 'Unknown'}</div>
            </div>
        `;
        card.onclick = (e) => { e.preventDefault(); openGame(game); };
        frag.appendChild(card);
    });
    gamesGrid.appendChild(frag);
}

function handleSearch() {
    const query = searchInput.value.toLowerCase().trim();
    let results = currentFilter === 'all' ? allGames : allGames.filter(g => g.sourceName === currentFilter);
    if (query !== '') {
        const tokens = query.split(/\s+/);
        results = results.filter(g => {
            const target = `${g.name} ${g.author || ''} ${g.sourceName || ''}`.toLowerCase();
            return tokens.every(t => target.includes(t));
        });
    }
    renderGames(results);
}
searchInput.addEventListener('input', () => {
    clearTimeout(window._searchTimer);
    window._searchTimer = setTimeout(handleSearch, 150);
});

document.getElementById('filterBar').addEventListener('click', (e) => {
    const btn = e.target.closest('.filter-btn');
    if (!btn) return;
    document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    currentFilter = btn.dataset.source;
    handleSearch();
});

async function loadAllSources() {
    const cached = localStorage.getItem('uraniumGamesCache');
    if (cached) {
        try { allGames = JSON.parse(cached); renderGames(allGames); statusLine.textContent = 'Showing cached library — refreshing…'; } catch (e) {}
    }

    let newGames = [...customGames];

    const fetchPromises = sources.map(async (source) => {
        let sourceData = [];
        try {
            if (source.type === 'json') {
                const res = await fetch(source.json + "?t=" + Date.now());
                const data = await res.json();
                sourceData = data.map(item => ({
                    ...item,
                    sourceName: source.name,
                    resolvedCover: item.cover
                        ? item.cover.replace("{COVER_URL}", source.cover).replace("{HTML_URL}", source.html)
                        : (source.icon || ''),
                    resolvedUrl: item.url ? item.url.replace("{HTML_URL}", source.html) : ''
                }));
            } else if (source.type === 'combined') {
                for (const repo of source.repos) {
                    try {
                        const res = await fetch(`https://api.github.com/repos/${repo}/contents/`);
                        if (res.ok) {
                            const files = await res.json();
                            files.forEach(file => {
                                if (file.type === 'dir' || file.name.endsWith('.html')) {
                                    sourceData.push({
                                        name: file.name.replace('.html', ''),
                                        author: repo,
                                        sourceName: source.name,
                                        resolvedCover: source.icon,
                                        resolvedUrl: `https://cdn.jsdelivr.net/gh/${repo}@main/${file.name}${file.type === 'dir' ? '/index.html' : ''}`
                                    });
                                }
                            });
                        }
                    } catch (e) {}
                }
            }
        } catch (error) {}
        return sourceData;
    });

    const results = await Promise.all(fetchPromises);
    results.forEach(data => newGames = newGames.concat(data));

    const uniqueGames = [];
    const seen = new Set();
    for (const item of newGames) {
        const key = item.name + item.resolvedUrl;
        if (!seen.has(key)) { seen.add(key); uniqueGames.push(item); }
    }

    allGames = uniqueGames;
    localStorage.setItem('uraniumGamesCache', JSON.stringify(allGames));
    statusLine.textContent = `${allGames.length} games synced`;
    handleSearch();
}

function showModalError(name, reason) {
    gameFrame.style.display = 'none';
    modalError.style.display = 'flex';
    document.getElementById('modalErrorTitle').textContent = name + ' failed to load';
    document.getElementById('modalErrorReason').textContent = reason;
}

function hideModalError() {
    modalError.style.display = 'none';
    gameFrame.style.display = 'block';
}

function openGame(game) {
    const url = game.resolvedUrl;
    if (!url) return;
    gameFrame.src = 'about:blank';
    hideModalError();
    gameModal.style.display = 'flex';

    if (url.startsWith('/') || (url.startsWith('http') && !url.includes('cdn.jsdelivr.net') && !url.includes('api.github.com'))) {
        gameFrame.src = url;
        return;
    }

    const cacheBusterUrl = url + (url.includes('?') ? '&' : '?') + 't=' + Date.now();
    fetch(cacheBusterUrl)
        .then(res => {
            if (!res.ok) throw new Error('HTTP_' + res.status);
            const ct = res.headers.get('content-type') || '';
            if (!ct.includes('html') && !ct.includes('javascript') && !ct.includes('text')) throw new Error('BAD_CONTENT');
            return res.text();
        })
        .then(html => {
            if (html.length < 50) throw new Error('EMPTY');
            if (currentBlobUrl) URL.revokeObjectURL(currentBlobUrl);
            const safetyScript = `<script>
                window.onbeforeunload = function() { return "Staying in site!"; };
                window.open = function() { return null; };
                setInterval(function() {
                    document.querySelectorAll('.ad,.ads,.adsbygoogle,.banner-ads,[id^="ad-"],iframe[src*="doubleclick"],iframe[src*="googleads"]').forEach(ad => ad.remove());
                }, 500);
            <\/script>`;
            const finalHtml = html.toLowerCase().includes('<head>')
                ? html.replace(/<head>/i, '<head>' + safetyScript)
                : safetyScript + html;
            currentBlobUrl = URL.createObjectURL(new Blob([finalHtml], { type: 'text/html;charset=utf-8' }));
            gameFrame.src = currentBlobUrl;
        })
        .catch(err => {
            let reason = 'Failed to load game from CDN.';
            if (err.message === 'EMPTY') reason = 'Game file returned empty — it may have been removed.';
            else if (err.message === 'BAD_CONTENT') reason = 'CDN returned unexpected content — possible redirect loop.';
            else if (err.message && err.message.startsWith('HTTP_')) reason = 'CDN returned error ' + err.message.replace('HTTP_', '') + ' — file may not exist.';
            else if (err.message === 'Failed to fetch') reason = 'CDN unreachable — try again later.';
            showModalError(game.name, reason);
        });
}

function closeModal() {
    gameModal.style.display = 'none';
    gameFrame.src = 'about:blank';
    hideModalError();
    if (currentBlobUrl) { URL.revokeObjectURL(currentBlobUrl); currentBlobUrl = null; }
}
document.getElementById('closeBtn').addEventListener('click', closeModal);

window.addEventListener('load', loadAllSources);
