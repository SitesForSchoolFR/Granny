<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Jogando — NEBULA</title>
<style>
  :root{
    --bg:#08080f; --bg2:#0d0d19;
    --tx:#eceaf6; --mut:#9b98b3;
    --acc:#8b7cf7; --acc2:#5eead4;
    --bd:rgba(255,255,255,.12);
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%;background:var(--bg);color:var(--tx);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif}
  #bar{
    position:fixed;top:0;left:0;right:0;z-index:10;
    display:flex;align-items:center;gap:12px;
    padding:9px 14px;
    background:rgba(13,13,25,.96);
    border-bottom:1px solid var(--bd);
  }
  #bar .star{color:var(--acc);font-size:15px;line-height:1}
  #name{font-size:13.5px;font-weight:650;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  #bar .spacer{flex:1}
  #bar button, #bar a.back{
    font:inherit;font-size:12px;font-weight:600;
    color:var(--mut);
    background:rgba(255,255,255,.04);
    border:1px solid var(--bd);
    border-radius:9px;
    padding:6px 11px;
    cursor:pointer;text-decoration:none;
    transition:color .2s,border-color .2s,background .2s;
  }
  #bar button:hover, #bar a.back:hover{color:var(--tx);border-color:rgba(255,255,255,.25);background:rgba(255,255,255,.08)}
  #bar a.back{color:var(--acc2)}
  #stage{position:fixed;top:42px;bottom:0;left:0;right:0;background:#000}
  #frame{width:100%;height:100%;border:0;display:block;background:#000}
  #note{
    position:fixed;bottom:14px;left:50%;transform:translateX(-50%);
    z-index:20;max-width:min(520px,calc(100vw - 30px));
    background:rgba(13,13,25,.94);
    border:1px solid rgba(139,124,247,.4);
    color:var(--tx);
    font-size:12.5px;line-height:1.5;
    padding:10px 16px;border-radius:12px;
    opacity:0;pointer-events:none;
    transition:opacity .35s ease;
  }
  #note.show{opacity:1}
  #errbox{display:none;place-items:center;height:100%;text-align:center;color:var(--mut);font-size:14px;padding:20px;line-height:1.7}
  #errbox a{color:var(--acc2)}
  @media (max-width:560px){ #name{max-width:34vw} #bar button{padding:6px 8px} }
</style>
</head>
<body>
  <div id="bar">
    <span class="star">✦</span>
    <span id="name">Jogo</span>
    <span class="spacer"></span>
    <button id="b-mirror" type="button" title="Se o jogo não carregar, troca para o outro espelho">Espelho</button>
    <button id="b-direct" type="button" title="Abre o jogo direto, fora da janela do NEBULA">Abrir direto</button>
    <a class="back" href="./" title="Voltar para o site">NEBULA</a>
  </div>

  <div id="stage">
    <iframe id="frame" title="Jogo" allow="fullscreen; gamepad; autoplay; pointer-lock" allowfullscreen></iframe>
    <div id="errbox">
      <div>
        O jogo não carregou neste espelho. 😢<br>
        Tente o botão <strong>Espelho</strong> acima, ou <a href="./">volte ao NEBULA</a> e use o botão 🔗 de espelhos do card.
      </div>
    </div>
  </div>

  <div id="note"></div>

<script>
(function () {
  'use strict';
  var q = new URLSearchParams(location.search);
  var src = q.get('g') || '';
  var fb = q.get('fb') || '';
  var name = q.get('n') || 'Jogo';
  document.title = name + ' — NEBULA';
  document.getElementById('name').textContent = name;

  var frame = document.getElementById('frame');
  var note = document.getElementById('note');
  var errbox = document.getElementById('errbox');
  var current = src, alt = fb, switched = false, failed = false, noteTimer = null;

  function showNote(t, ms) {
    note.textContent = t;
    note.classList.add('show');
    clearTimeout(noteTimer);
    noteTimer = setTimeout(function () { note.classList.remove('show'); }, ms || 5200);
  }

  if (!src) {
    document.getElementById('stage').innerHTML =
      '<div style="display:grid;place-items:center;height:100%;color:#9b98b3">Link de jogo inválido. <a href="./" style="color:#5eead4">Voltar ao NEBULA</a></div>';
    return;
  }

  frame.src = src;

  frame.addEventListener('error', function () {
    if (!failed) {
      failed = true;
      if (alt) {
        current = alt;
        frame.src = alt;
        showNote('O espelho principal falhou — troquei automaticamente para o alternativo. Se aparecer um botão PLAY/Load, clique! 🎮', 6500);
      } else {
        frame.style.display = 'none';
        errbox.style.display = 'grid';
      }
    }
  });

  showNote('Se aparecer um botão PLAY ou Load, clique para começar! 🎮', 6000);

  document.getElementById('b-direct').addEventListener('click', function () {
    window.open(current, '_blank', 'noopener');
  });

  document.getElementById('b-mirror').addEventListener('click', function () {
    if (!fb) { showNote('Este jogo tem apenas um espelho — use “Abrir direto”.', 4000); return; }
    switched = !switched;
    current = switched ? fb : src;
    failed = false;
    frame.style.display = 'block';
    errbox.style.display = 'none';
    frame.src = current;
    showNote(switched ? 'Usando o espelho alternativo…' : 'Voltando para o espelho principal…', 3000);
  });

  addEventListener('keydown', function (e) {
    if (e.key === 'Escape') window.close();
  });
})();
</script>
</body>
</html>
